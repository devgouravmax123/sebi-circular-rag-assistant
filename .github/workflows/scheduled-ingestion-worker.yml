name: Scheduled Ingestion Worker & Guest Sweeper

on:
  schedule:
    # Run every 15 minutes to process queued documents and sweep expired guest sessions
    - cron: '*/15 * * * *'
  workflow_dispatch: # Enable manual on-demand trigger via GitHub Console or CLI

# Ensure only one runner executes at a time; never abruptly cancel an active ingestion batch
concurrency:
  group: ingestion-worker-runner
  cancel-in-progress: false

jobs:
  ingest-and-sweep:
    name: Process Ingestion Queue & Purge Expired Guests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Activation Gate: Scheduled runs are dormant until ENABLE_SCHEDULED_WORKER is set to 'true'.
    # Manual execution via workflow_dispatch is always permitted.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_WORKER == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Validate Required Secrets (Fail-Closed)
        shell: bash
        env:
          HAS_WORKER_DB: ${{ secrets.WORKER_DATABASE_URL != '' }}
          HAS_API_DB: ${{ secrets.DATABASE_URL != '' }}
          HAS_STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER != '' }}
          HAS_S3_BUCKET: ${{ secrets.S3_BUCKET_NAME != '' }}
          HAS_S3_KEY: ${{ secrets.S3_ACCESS_KEY_ID != '' }}
          HAS_S3_SECRET: ${{ secrets.S3_SECRET_ACCESS_KEY != '' }}
          HAS_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT_URL != '' }}
        run: |
          missing=0
          if [ "$HAS_WORKER_DB" != "true" ]; then
            echo "::error::Missing required secret: WORKER_DATABASE_URL"
            missing=1
          fi
          if [ "$HAS_API_DB" != "true" ]; then
            echo "::error::Missing required secret: DATABASE_URL"
            missing=1
          fi
          if [ "$HAS_STORAGE_PROVIDER" != "true" ]; then
            echo "::error::Missing required secret: STORAGE_PROVIDER"
            missing=1
          fi
          if [ "$HAS_S3_BUCKET" != "true" ]; then
            echo "::error::Missing required secret: S3_BUCKET_NAME"
            missing=1
          fi
          if [ "$HAS_S3_KEY" != "true" ]; then
            echo "::error::Missing required secret: S3_ACCESS_KEY_ID"
            missing=1
          fi
          if [ "$HAS_S3_SECRET" != "true" ]; then
            echo "::error::Missing required secret: S3_SECRET_ACCESS_KEY"
            missing=1
          fi
          if [ "$HAS_S3_ENDPOINT" != "true" ]; then
            echo "::error::Missing required secret: S3_ENDPOINT_URL"
            missing=1
          fi
          if [ $missing -ne 0 ]; then
            echo "Fail-closed check: Scheduled runner cannot operate safely without all required production secrets."
            exit 1
          fi
          echo "All required secret configurations verified."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Bounded Ingestion Worker
        env:
          PYTHONPATH: backend
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION_NAME: ${{ secrets.S3_REGION_NAME }}
        run: |
          python -m app.ingestion.worker --max-jobs 10 --exit-when-idle --timeout-seconds 300

      - name: Run Expired Guest Sweeper
        env:
          PYTHONPATH: backend
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION_NAME: ${{ secrets.S3_REGION_NAME }}
        run: |
          python -m app.services.guest_service --batch-limit 50 --max-age-hours 24

